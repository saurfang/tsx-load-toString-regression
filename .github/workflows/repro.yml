name: repro
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - run: pnpm install
      - run: pnpm repro
